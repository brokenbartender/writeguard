name: Codex PR Review

# AI-assisted pull-request review using an OpenAI model (the Codex-for-OSS maintainer workflow).
#
# SAFETY MODEL:
#   - Trigger is `pull_request_target`, so the OPENAI_API_KEY secret is available even for fork PRs.
#   - We NEVER check out or execute the PR's code. We only read the DIFF (data, not code) and send
#     it to the model. Untrusted PR code never runs with our secrets.
#   - The model only POSTS A COMMENT. It never approves, merges, labels, or closes anything.
#     A human maintainer makes every decision.
#   - Skips cleanly (no red X) when OPENAI_API_KEY is not configured.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-4.1-mini' }}   # set repo variable CODEX_MODEL to your model
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Guard — require API key
        id: guard
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping AI review (this is expected on forks without the secret)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the diff (data only — PR code is never executed)
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh pr diff "$PR" --repo "$REPO" > pr.diff || touch pr.diff
          # cap diff size to control token cost (first ~4000 lines)
          head -c 120000 pr.diff > pr.diff.capped && mv pr.diff.capped pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"

      - name: Ask the model to review
        if: steps.guard.outputs.skip != 'true'
        run: |
          DIFF=$(cat pr.diff)
          if [ -z "$DIFF" ]; then echo "empty diff"; exit 0; fi
          SYSTEM='You are a careful senior code reviewer for writeguard, a small Python library that verifies AI coding-agent filesystem claims against real disk state. Review the diff for correctness bugs, security issues (this is a security tool — be strict about the crypto/HMAC/PII paths), missing tests, and API/documentation drift. Be concise. Use a short bulleted list. If it looks good, say so briefly. This is advisory — a human decides.'
          # Build the JSON request safely with jq
          REQ=$(jq -n --arg m "$CODEX_MODEL" --arg s "$SYSTEM" --arg d "$DIFF" '{
            model: $m,
            messages: [
              {role:"system", content:$s},
              {role:"user", content:("Review this pull-request diff:\n\n```diff\n" + $d + "\n```")}
            ],
            temperature: 0.2
          }')
          RESP=$(curl -sS https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQ")
          BODY=$(echo "$RESP" | jq -r '.choices[0].message.content // empty')
          if [ -z "$BODY" ]; then
            echo "::warning::No review content returned. Raw: $(echo "$RESP" | jq -c '.error // "unknown"')"
            exit 0
          fi
          {
            echo "🤖 **Codex review** (advisory — a human maintainer decides)"
            echo
            echo "$BODY"
            echo
            echo "<sub>Model: \`$CODEX_MODEL\`. Reviewed the diff only; PR code was not executed.</sub>"
          } > review.md
          gh pr comment "$PR" --repo "$REPO" --body-file review.md
