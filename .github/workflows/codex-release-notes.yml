name: Codex Release Notes

# Drafts human-readable release notes from the commit history when a release is created
# (typically as a draft). The maintainer reviews and edits before publishing.
# Skips cleanly without OPENAI_API_KEY.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to summarize (e.g. v1.2.0)"
        required: true

permissions:
  contents: write   # to update the release body

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-4.1-mini' }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard — require API key
        id: guard
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Collect commits since previous tag
        if: steps.guard.outputs.skip != 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          RANGE=$([ -n "$PREV" ] && echo "$PREV..$TAG" || echo "$TAG")
          echo "range: $RANGE"
          git log --no-merges --pretty="- %s (%h)" "$RANGE" > commits.txt 2>/dev/null || git log --no-merges --pretty="- %s (%h)" -30 > commits.txt
          head -c 40000 commits.txt > commits.capped && mv commits.capped commits.txt
      - name: Draft notes with the model
        if: steps.guard.outputs.skip != 'true'
        run: |
          COMMITS=$(cat commits.txt)
          [ -z "$COMMITS" ] && { echo "no commits"; exit 0; }
          SYSTEM='You write clear, user-facing release notes for writeguard (a Python library for verifying AI-agent file writes) from a raw commit list. Group into: Added, Changed, Fixed, Security, Docs. Omit empty groups. Skip noise (merge/chore/formatting). Plain markdown, no preamble.'
          REQ=$(jq -n --arg m "$CODEX_MODEL" --arg s "$SYSTEM" --arg c "$COMMITS" --arg t "$TAG" '{
            model:$m, temperature:0.2,
            messages:[{role:"system",content:$s},{role:"user",content:("Release " + $t + ". Commits:\n" + $c)}]
          }')
          RESP=$(curl -sS https://api.openai.com/v1/chat/completions -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d "$REQ")
          NOTES=$(echo "$RESP" | jq -r '.choices[0].message.content // empty')
          [ -z "$NOTES" ] && { echo "::warning::no notes"; exit 0; }
          printf '%s\n' "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          # Update the release body (maintainer edits/publishes). Only on real release events.
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            printf '%s\n\n---\n<sub>Draft notes by Codex Release Notes — review before publishing.</sub>\n' "$NOTES" > body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file body.md
          fi
