name: Publish to PyPI

# Single canonical publish path. Fires when a GitHub Release is published (recommended),
# or manually. Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify version matches tag (release only)
        if: github.event_name == 'release'
        run: |
          PKG_VER=$(python -c "import writeguard, sys; sys.stdout.write(writeguard.__version__)")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VER tag=$TAG_VER"
          test "$PKG_VER" = "$TAG_VER" || { echo "::error::Version $PKG_VER != tag $TAG_VER"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # gate publishes behind a protected environment
    permissions:
      id-token: write          # OIDC — required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
